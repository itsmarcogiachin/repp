# Progetto Xcode generato con XcodeGen: `xcodegen generate`
# Il file Repp.xcodeproj non è versionato, si rigenera da questo file.
name: Repp
options:
  bundleIdPrefix: com.marcogiachin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team di firma (Personal Team di Marco): qui, perché xcodegen sovrascrive quello scelto in Xcode.
    DEVELOPMENT_TEAM: R347QFK47Z
targets:
  Repp:
    type: application
    platform: iOS
    sources:
      - Repp
      - Shared
    dependencies:
      - target: ReppWidgets
    info:
      path: Repp/Info.plist
      properties:
        UIAppFonts:
          - Archivo-SemiBold.ttf
          - Archivo-Bold.ttf
          - Archivo-ExtraBold.ttf
          - Archivo-Black.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcogiachin.repp
        PRODUCT_NAME: Repp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Repp
        INFOPLIST_KEY_CFBundleDevelopmentRegion: it
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  # Estensione per il timer di riposo sulla schermata di blocco e nella Dynamic Island.
  ReppWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ReppWidgets
      - Shared
    info:
      path: ReppWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcogiachin.repp.widgets
        PRODUCT_NAME: ReppWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Repp
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
